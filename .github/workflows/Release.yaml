name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.27'

jobs:
  package-embed:
    name: Package eulix-embed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create eulix-embed.zip
        run: |
          zip -r eulix-embed.zip eulix-embed/ \
            -x "*/.venv/*" \
               "*/.ruff_cache/*" \
               "*/.pytest_cache/*" \
               "*/.mypy_cache/*" \
               "*/.git/*" \
               "*/__pycache__/*" \
               "*.pyc" \
               ".codespell-ignore"

      - name: Upload eulix-embed.zip
        uses: actions/upload-artifact@v4
        with:
          name: dist-embed
          path: eulix-embed.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: package-embed
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash # Git Bash on Windows too, so the same scripts work everywhere

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            parser_bin: eulix_parser_linux
            # "<requirements file>|<output name>"
            variants: >-
              onnx-amd.txt|eulix-linux-amd64-onnx-amd
              onnx-nvidia.txt|eulix-linux-amd64-onnx-nvidia

          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            parser_bin: eulix_parser_windows.exe
            variants: >-
              onnx-amd.txt|eulix-windows-amd64-onnx-amd
              onnx-nvidia.txt|eulix-windows-amd64-onnx-nvidia

          - os: macos-15 # Apple Silicon
            goos: darwin
            goarch: arm64
            ext: ''
            parser_bin: eulix_parser_darwin
            variants: >-
              torch-nvidia.txt|eulix-darwin-arm64

          - os: macos-15-intel # Intel
            goos: darwin
            goarch: amd64
            ext: ''
            parser_bin: eulix_parser_darwin
            variants: >-
              torch-nvidia.txt|eulix-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: eulix-parser

      - name: Build eulix-parser
        working-directory: ./eulix-parser
        run: cargo build --release

      - name: Download eulix-embed.zip
        uses: actions/download-artifact@v4
        with:
          name: dist-embed
          path: embed

      - name: Stage assets and hash parser
        id: stage
        env:
          EXT: ${{ matrix.ext }}
          PARSER_BIN: ${{ matrix.parser_bin }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          BINS=eulix-cli/internal/assets/bins
          mkdir -p "$BINS" dist

          # parser -> embedded into the cli
          cp "eulix-parser/target/release/eulix_parser${EXT}" "$BINS/${PARSER_BIN}"

          # parser -> standalone release asset
          cp "eulix-parser/target/release/eulix_parser${EXT}" \
             "dist/eulix-parser-${TARGET_OS}-${TARGET_ARCH}${EXT}"

          # embed zip -> embedded into the cli
          cp embed/eulix-embed.zip "$BINS/eulix-embed.zip"

          # hash of the parser for this os+arch
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=$(sha256sum "$BINS/${PARSER_BIN}" | awk '{print $1}')
          else
            HASH=$(shasum -a 256 "$BINS/${PARSER_BIN}" | awk '{print $1}')
          fi
          echo "Parser hash: ${HASH}"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

          ls -la "$BINS"

      - name: Build eulix CLI
        working-directory: ./eulix-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          HASH: ${{ steps.stage.outputs.hash }}
          VARIANTS: ${{ matrix.variants }}
          EXT: ${{ matrix.ext }}
        run: |
          for pair in $VARIANTS; do
            req="${pair%%|*}"
            out="${pair##*|}"

            echo "Building ${GOOS}/${GOARCH} (embed_requirements=${req}) -> ${out}${EXT}"

            go build \
              -ldflags="-s -w -X 'eulix/internal/assets.embed_requirements=${req}' -X 'eulix/internal/assets.embeddedParserHash=${HASH}'" \
              -trimpath \
              -o "../dist/${out}${EXT}" \
              ./cmd/eulix/main.go
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - package-embed
      - build
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release_assets

      - name: Generate checksums
        working-directory: release_assets
        run: |
          ls -la
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
